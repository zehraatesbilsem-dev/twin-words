        { word: "Utilitarian", correct: "Practical", wrong: ["Useless", "Decorative", "Fancy"] }
      ],
      C2: [
        { word: "Acumen", correct: "Insight", wrong: ["Slow", "Stupidity", "Ignorance"] },
        { word: "Alacrity", correct: "Eagerness", wrong: ["Slowness", "Apathy", "Reluctance"] },
        { word: "Banal", correct: "Common", wrong: ["Fresh", "Original", "Unique"] },
        { word: "Conundrum", correct: "Puzzle", wrong: ["Answer", "Solution", "Explanation"] },
        { word: "Disparate", correct: "Different", wrong: ["Equal", "Identical", "Same"] },
        { word: "Esoteric", correct: "Specialized", wrong: ["Known", "Public", "Common"] },
        { word: "Inscrutable", correct: "Mysterious", wrong: ["Easy", "Clear", "Transparent"] },
        { word: "Laconic", correct: "Brief", wrong: ["Wordy", "Verbose", "Garrulous"] },
        { word: "Obsequious", correct: "Servile", wrong: ["Proud", "Arrogant", "Rebellious"] },
        { word: "Paucity", correct: "Scarcity", wrong: ["Plenty", "Surplus", "Abundance"] },
        { word: "Perfunctory", correct: "Careless", wrong: ["Detailed", "Thorough", "Careful"] },
        { word: "Recalcitrant", correct: "Rebellious", wrong: ["Passive", "Obedient", "Compliant"] },
        { word: "Salubrious", correct: "Healthy", wrong: ["Toxic", "Unhealthy", "Harmful"] },
        { word: "Taciturn", correct: "Quiet", wrong: ["Loud", "Talkative", "Garrulous"] },
        { word: "Tenuous", correct: "Weak", wrong: ["Firm", "Solid", "Strong"] },
        { word: "Volatile", correct: "Unstable", wrong: ["Fixed", "Calm", "Steady"] },
        { word: "Expedite", correct: "Speed up", wrong: ["Slow", "Delay", "Hinder"] },
        { word: "Pellucid", correct: "Clear", wrong: ["Dark", "Opaque", "Muddy"] },
        { word: "Spurious", correct: "Fake", wrong: ["True", "Genuine", "Authentic"] },
        { word: "Zeal", correct: "Passion", wrong: ["Coldness", "Apathy", "Indifference"] }
      ]
    };

    // Local Storage Note Manager
    function getSavedNote(wordKey) {
      return localStorage.getItem('twin_words_note_' + wordKey) || '';
    }

    function saveNote(wordKey, noteValue) {
      localStorage.setItem('twin_words_note_' + wordKey, noteValue);
    }

    // Firebase Auth Listener
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const docRef = doc(db, "users", user.uid);
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
          currentUserDoc = { uid: user.uid, ...docSnap.data() };
          
          const avatar = currentUserDoc.avatar || '🦊';
          const name = currentUserDoc.username || 'Player';
          
          document.getElementById('user-avatar').innerText = avatar;
          document.getElementById('user-name').innerText = name;
          document.getElementById('menu-user-avatar').innerText = avatar;
          document.getElementById('menu-user-name').innerText = name;

          showSection('main-menu-section');
        }
      } else {
        currentUserDoc = null;
        showSection('auth-section');
      }
    });

    // Realtime Leaderboard Listener
    const q = query(collection(db, "users"), orderBy("highScore", "desc"), limit(5));
    onSnapshot(q, (snapshot) => {
      const board = document.getElementById('leaderboard-list');
      if (snapshot.empty) {
        board.innerHTML = `<div style="color:#64748b; font-size:13px; text-align:center;">No scores yet!</div>`;
        return;
      }
      board.innerHTML = snapshot.docs.map((doc, i) => {
        const u = doc.data();
        return `
          <div class="score-item">
            <div class="player-info">
              <span>#${i + 1}</span>
              <span>${u.avatar || '🦊'} ${u.username}</span>
            </div>
            <div>
              <span class="badge">${u.lastLevel || 'A1'}</span>
              <span class="points">${u.highScore || 0} Pts</span>
            </div>
          </div>
        `;
      }).join('');
    });

    // Navigation Helper
    function showSection(sectionId) {
      document.getElementById('auth-section').classList.add('hidden');
      document.getElementById('main-menu-section').classList.add('hidden');
      document.getElementById('dictionary-section').classList.add('hidden');
      document.getElementById('game-section').classList.add('hidden');

      document.getElementById(sectionId).classList.remove('hidden');
    }

    // Navigation Events
    document.getElementById('btn-nav-game').onclick = () => {
      showSection('game-section');
      restartGame();
    };

    document.getElementById('btn-nav-dict').onclick = () => {
      showSection('dictionary-section');
      renderDictionary();
    };

    document.getElementById('btn-dict-back').onclick = () => showSection('main-menu-section');
    document.getElementById('btn-game-back').onclick = () => {
      clearInterval(timerInterval);
      showSection('main-menu-section');
    };

    // Event Handlers for Auth Tabs
    document.getElementById('btn-login-tab').onclick = () => switchTab('login');
    document.getElementById('btn-reg-tab').onclick = () => switchTab('register');

    function switchTab(target) {
      document.getElementById('msg').className = "message";
      if(target === 'login') {
        document.getElementById('login-form').classList.remove('hidden');
        document.getElementById('register-form').classList.add('hidden');
        document.getElementById('btn-login-tab').classList.add('active');
        document.getElementById('btn-reg-tab').classList.remove('active');
      } else {
        document.getElementById('register-form').classList.remove('hidden');
        document.getElementById('login-form').classList.add('hidden');
        document.getElementById('btn-reg-tab').classList.add('active');
        document.getElementById('btn-login-tab').classList.remove('active');
      }
    }

    document.querySelectorAll('.avatar-item').forEach(item => {
      item.onclick = (e) => {
        document.querySelectorAll('.avatar-item').forEach(i => i.classList.remove('selected'));
        e.target.classList.add('selected');
        selectedAvatar = e.target.getAttribute('data-avatar');
      };
    });

    // Register
    document.getElementById('btn-register').onclick = async () => {
      const u = document.getElementById('reg-username').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value.trim();

      if (!u || !email || !password) return showMessage("Please fill in all fields!", "error");

      try {
        const res = await createUserWithEmailAndPassword(auth, email, password);
        await setDoc(doc(db, "users", res.user.uid), {
          username: u,
          email: email,
          avatar: selectedAvatar,
          highScore: 0,
          lastLevel: 'A1'
        });
        showMessage("Account created successfully!", "success");
      } catch (err) {
        showMessage(err.message, "error");
      }
    };

    // Login
    document.getElementById('btn-login').onclick = async () => {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value.trim();

      if (!email || !password) return showMessage("Please fill in all fields!", "error");

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        showMessage("Invalid email or password!", "error");
      }
    };

    // Logout
    const logoutHandler = () => {
      clearInterval(timerInterval);
      signOut(auth);
    };
    document.getElementById('btn-menu-logout').onclick = logoutHandler;

    // Level Selection
    document.querySelectorAll('.level-btn').forEach(btn => {
      btn.onclick = (e) => {
        document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentLevel = e.target.getAttribute('data-level');
        restartGame();
      };
    });

    // --- INTERACTIVE PERSONAL DICTIONARY ---
    function renderDictionary() {
      const container = document.getElementById('dictionary-list');
      const searchVal = document.getElementById('dict-search').value.toLowerCase().trim();
      container.innerHTML = '';

      let allWords = [];
      Object.keys(wordDatabase).forEach(lvl => {
        wordDatabase[lvl].forEach(item => {
          const userNote = getSavedNote(item.word);
          allWords.push({ ...item, level: lvl, userNote: userNote });
        });
      });

      const filtered = allWords.filter(i => 
        i.word.toLowerCase().includes(searchVal) || 
        i.correct.toLowerCase().includes(searchVal) ||
        i.userNote.toLowerCase().includes(searchVal)
      );

      if (filtered.length === 0) {
        container.innerHTML = `<div style="color:#64748b; font-size:14px; text-align:center; padding: 20px;">No matching words or notes found.</div>`;
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'dict-card';
        card.innerHTML = `
          <div class="dict-left">
            <span class="dict-word">${item.word}</span>
            <span class="badge">${item.level}</span>
          </div>
          <div class="dict-center">
            <input type="text" class="dict-note-input" id="note-input-${item.word}" value="${item.userNote}" placeholder="Kendi anlamını / notunu yaz...">
            <button class="dict-save-btn" onclick="saveWordNote('${item.word}')">💾 Kaydet</button>
          </div>
          <div class="dict-right">
            <span class="dict-label">Synonym:</span>
            <span class="dict-tag">${item.correct}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    window.filterDictionary = renderDictionary;

    window.saveWordNote = function(wordKey) {
      const inputEl = document.getElementById(`note-input-${wordKey}`);
      if (inputEl) {
        const val = inputEl.value.trim();
        saveNote(wordKey, val);
        alert(`"${wordKey}" kelimesi için notun kaydedildi! ✅`);
      }
    };

    // Game Logic
    function restartGame() {
      clearInterval(timerInterval);
      currentScore = 0;
      lives = 3;
      timeLeft = 60;
      canAnswer = true;
      playedWords = [];
      wrongWordsHistory = [];
      isReviewMode = false;
      comboCount = 0;
      fiftyFiftyUsed = false;
      extraTimeUsed = false;

      document.getElementById('joker-5050').disabled = false;
      document.getElementById('joker-time').disabled = false;
      document.getElementById('review-banner').classList.add('hidden');
      document.getElementById('combo-banner').classList.add('hidden');
      document.getElementById('game-play-area').classList.remove('hidden');
      document.getElementById('game-over-area').classList.add('hidden');
      document.getElementById('current-score').innerText = currentScore;
      document.getElementById('lives-display').innerText = "❤".repeat(lives);
      document.getElementById('timer-display').innerText = timeLeft + "s";
      document.getElementById('game-msg').className = "message";

      startTimer();
      nextQuestion();
    }

    document.getElementById('btn-restart').onclick = restartGame;

    function startTimer() {
      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timer-display').innerText = timeLeft + "s";
        if(timeLeft <= 0) {
          clearInterval(timerInterval);
          startReviewMode();
        }
      }, 1000);
    }

    function nextQuestion() {
      canAnswer = true;
      document.getElementById('game-msg').className = "message";

      if(isReviewMode) {
        if(wrongWordsHistory.length === 0) {
          finishGame();
          return;
        }
        currentQuestion = wrongWordsHistory.shift();
      } else {
        const pool = wordDatabase[currentLevel] || wordDatabase['A1'];
        let availableWords = pool.filter(item => !playedWords.includes(item.word));

        if (availableWords.length === 0) {
          playedWords = [];
          availableWords = [...pool];
        }

        const index = Math.floor(Math.random() * availableWords.length);
        currentQuestion = availableWords[index];
        playedWords.push(currentQuestion.word);
      }

      document.getElementById('target-word').innerText = currentQuestion.word;
      let options = [...currentQuestion.wrong, currentQuestion.correct].sort(() => Math.random() - 0.5);

      const container = document.getElementById('options-container');
      container.innerHTML = "";
      options.forEach(o => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = o;
        btn.onclick = (e) => checkAnswer(o, e.target);
        container.appendChild(btn);
      });
    }

    function checkAnswer(selected, targetBtn) {
      if(!canAnswer) return;
      canAnswer = false;

      const msg = document.getElementById('game-msg');
      const allButtons = document.querySelectorAll('.option-btn');

      if(selected === currentQuestion.correct) {
        comboCount++;
        let multiplier = comboCount >= 5 ? 2 : (comboCount >= 3 ? 1.5 : 1);
        const basePoints = isReviewMode ? 5 : 10;
        const pointsAwarded = Math.round(basePoints * multiplier);

        currentScore += pointsAwarded;
        document.getElementById('current-score').innerText = currentScore;
        targetBtn.classList.add('correct-highlight');

        const comboBanner = document.getElementById('combo-banner');
        if (comboCount >= 3) {
          comboBanner.innerText = `🔥 ${comboCount} COMBO! (${multiplier}x Puan)`;
          comboBanner.classList.remove('hidden');
        } else {
          comboBanner.classList.add('hidden');
        }
        
        msg.innerText = `Correct! 🎉 (+${pointsAwarded} Pts)`;
        msg.className = "message success";
        setTimeout(nextQuestion, 800);
      } else {
        comboCount = 0;
        document.getElementById('combo-banner').classList.add('hidden');
        targetBtn.classList.add('wrong-highlight');
        allButtons.forEach(btn => {
          if(btn.innerText === currentQuestion.correct) btn.classList.add('correct-highlight');
        });

        if(!isReviewMode) {
          lives--;
          document.getElementById('lives-display').innerText = "❤️".repeat(Math.max(0, lives));
          if(!wrongWordsHistory.some(w => w.word === currentQuestion.word)) wrongWordsHistory.push(currentQuestion);

          msg.innerText = `Wrong! Correct answer was "${currentQuestion.correct}" ❌`;
          msg.className = "message error";

          if(lives <= 0) {
            clearInterval(timerInterval);
            setTimeout(startReviewMode, 1200);
          } else {
            setTimeout(nextQuestion, 1200);
          }
        } else {
          msg.innerText = `Wrong again! Correct was "${currentQuestion.correct}"`;
          msg.className = "message error";
          setTimeout(nextQuestion, 1200);
        }
      }
    }

    // Jokers
    document.getElementById('joker-5050').onclick = () => {
      if(fiftyFiftyUsed || !canAnswer) return;
      fiftyFiftyUsed = true;
      document.getElementById('joker-5050').disabled = true;

      const buttons = Array.from(document.querySelectorAll('.option-btn'));
      const wrongButtons = buttons.filter(btn => btn.innerText !== currentQuestion.correct);
      wrongButtons.sort(() => Math.random() - 0.5);
      wrongButtons.slice(0, 2).forEach(btn => {
        btn.disabled = true;
        btn.innerText = "❌";
      });
    };

    document.getElementById('joker-time').onclick = () => {
      if(extraTimeUsed || isReviewMode) return;
      extraTimeUsed = true;
      document.getElementById('joker-time').disabled = true;
      timeLeft += 10;
      document.getElementById('timer-display').innerText = timeLeft + "s";
    };

    function startReviewMode() {
      if(wrongWordsHistory.length === 0) {
        finishGame();
        return;
      }
      isReviewMode = true;
      document.getElementById('joker-5050').disabled = true;
      document.getElementById('joker-time').disabled = true;
      document.getElementById('combo-banner').classList.add('hidden');
      document.getElementById('review-banner').classList.remove('hidden');
      document.getElementById('timer-display').innerText = "OFF";
      nextQuestion();
    }

    async function finishGame() {
      clearInterval(timerInterval);
      document.getElementById('review-banner').classList.add('hidden');
      document.getElementById('combo-banner').classList.add('hidden');
      document.getElementById('game-play-area').classList.add('hidden');
      document.getElementById('game-over-area').classList.remove('hidden');
      document.getElementById('final-score').innerText = currentScore;
      document.getElementById('game-msg').className = "message";

      if (currentUserDoc && currentScore > (currentUserDoc.highScore || 0)) {
        const userRef = doc(db, "users", currentUserDoc.uid);
        await setDoc(userRef, {
          highScore: currentScore,
          lastLevel: currentLevel
        }, { merge: true });
        currentUserDoc.highScore = currentScore;
      }
    }

    function showMessage(m, type) {
      const el = document.getElementById('msg');
      el.innerText = m;
      el.className = "message " + type;
    }
  </script>
</body>
</html>
