<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0b0f19; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    
    .title { font-size: 32px; font-weight: 800; color: #3b82f6; margin-bottom: 25px; letter-spacing: 2px; text-transform: uppercase; }
    .main-container { display: flex; gap: 20px; width: 100%; max-width: 900px; flex-wrap: wrap; justify-content: center; }
    
    /* Leaderboard */
    .leaderboard-card { background: #151d2a; border: 1px solid #1e293b; border-radius: 16px; padding: 20px; flex: 1; min-width: 280px; height: fit-content; }
    .leaderboard-title { font-size: 16px; font-weight: bold; color: #f59e0b; display: flex; align-items: center; gap: 8px; margin-bottom: 15px; }
    .score-list { display: flex; flex-direction: column; gap: 8px; }
    .score-item { background: #222d3d; border-radius: 8px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #2d3b4e; }
    .player-info { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 15px; }
    .badge { background: #3b82f6; color: white; font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    .points { color: #818cf8; font-weight: bold; font-size: 15px; }
    
    /* Auth Form */
    .auth-card { background: #151d2a; border: 1px solid #1e293b; border-radius: 16px; padding: 35px 30px; flex: 1.3; min-width: 280px; display: flex; flex-direction: column; align-items: center; }
    .tabs { display: flex; width: 100%; margin-bottom: 25px; border-bottom: 2px solid #1e293b; }
    .tab-btn { flex: 1; padding: 10px; background: none; border: none; outline: none; cursor: pointer; font-size: 16px; font-weight: bold; color: #64748b; transition: 0.2s; }
    .tab-btn.active { color: #3b82f6; border-bottom: 2px solid #3b82f6; }
    .form-box { width: 100%; display: flex; flex-direction: column; gap: 15px; }
    .input-field { width: 100%; padding: 12px 16px; background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; color: white; font-size: 14px; outline: none; }
    .input-field:focus { border-color: #3b82f6; }
    .btn-submit { width: 100%; padding: 12px; background: #3730a3; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 5px; }
    .btn-submit:hover { background: #4338ca; }
    
    /* Avatar List */
    .avatar-title { font-size: 11px; font-weight: bold; color: #94a3b8; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px; text-align: center; }
    .avatar-list { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; }
    .avatar-item { font-size: 24px; padding: 8px 12px; border-radius: 8px; background: #0f172a; border: 1px solid #1e293b; cursor: pointer; transition: 0.2s; user-select: none; }
    .avatar-item.selected { border-color: #3b82f6; background: #1e1b4b; }
    
    /* Game Panel */
    .game-card { background: #151d2a; border: 1px solid #1e293b; border-radius: 16px; padding: 25px; width: 100%; max-width: 650px; text-align: center; display: flex; flex-direction: column; gap: 20px; }
    .game-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 15px; }
    .user-badge { font-weight: bold; font-size: 16px; color: #3b82f6; display: flex; align-items: center; gap: 8px; }
    
    .stats-bar { display: flex; justify-content: space-around; background: #0f172a; padding: 12px; border-radius: 10px; border: 1px solid #1e293b; }
    .stat-box { font-weight: bold; font-size: 15px; }
    .stat-label { font-size: 11px; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 2px; }
    
    /* Difficulty Level Selector */
    .level-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 10px; }
    .level-btn { background: #0f172a; border: 1px solid #1e293b; color: #94a3b8; padding: 8px 0; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .level-btn.active { background: #3b82f6; color: white; border-color: #3b82f6; }
    
    .word-box { background: #0f172a; border: 1px solid #1e293b; padding: 20px; border-radius: 12px; }
    .target-word { font-size: 32px; font-weight: 800; color: #38bdf8; letter-spacing: 1px; }
    
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .option-btn { background: #1e293b; border: 1px solid #334155; color: white; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .option-btn:hover:not(:disabled) { background: #334155; border-color: #3b82f6; }
    .option-btn:disabled { opacity: 0.2; cursor: not-allowed; border-color: #1e293b; }
    
    /* Jokers Container */
    .jokers-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 5px; }
    .joker-btn { background: #1e1b4b; border: 1px solid #4338ca; color: #a5b4fc; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .joker-btn:hover:not(:disabled) { background: #312e81; color: white; }
    .joker-btn:disabled { opacity: 0.3; cursor: not-allowed; border-color: #1e293b; color: #64748b; }

    /* Doğru/Yanlış Efekt Renkleri */
    .option-btn.correct-highlight { background: #064e3b !important; border-color: #10b981 !important; color: #34d399 !important; font-weight: bold; }
    .option-btn.wrong-highlight { background: #7f1d1d !important; border-color: #ef4444 !important; color: #f87171 !important; }

    .message { font-size: 13px; text-align: center; padding: 8px; border-radius: 6px; display: none; width: 100%; }
    .message.error { background: #451a1a; color: #f87171; display: block; }
    .message.success { background: #064e3b; color: #34d399; display: block; }
    .message.info { background: #1e1b4b; color: #a5b4fc; display: block; }
    
    .btn-logout { background: #7f1d1d; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
    .btn-restart { background: #2563eb; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 15px; width: 100%; }

    .review-banner { background: #312e81; color: #c7d2fe; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: bold; border: 1px solid #4338ca; }
    .combo-banner { color: #f59e0b; font-weight: 800; font-size: 18px; text-shadow: 0 0 10px rgba(245, 158, 11, 0.4); animation: pulse 0.5s ease-in-out; }

    @keyframes pulse {
      0% { transform: scale(0.95); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .hidden { display: none !important; }
  </style>

<body>

  <div class="title">TWIN WORDS</div>

  <!-- AUTH SECTION -->
  <div id="auth-section" class="main-container">

      </div>

      <div id="login-form" class="form-box">
        <input type="text" id="login-username" class="input-field" placeholder="Username">
        <input type="password" id="login-password" class="input-field" placeholder="Password">
        <button class="btn-submit" onclick="login()">Start Game</button>
      </div>

      <div id="register-form" class="form-box hidden">
        <div class="avatar-title">Choose Avatar</div>
        <div class="avatar-list">
          <span class="avatar-item selected" onclick="selectAvatar(this, '🦊')">🦊</span>
          <span class="avatar-item" onclick="selectAvatar(this, '🐱')">🐱</span>
          <span class="avatar-item" onclick="selectAvatar(this, '🐼')">🐼</span>
          <span class="avatar-item" onclick="selectAvatar(this, '🦁')">🦁</span>
        </div>
        <input type="text" id="reg-username" class="input-field" placeholder="Username">
        <input type="password" id="reg-password" class="input-field" placeholder="Password">
        <button class="btn-submit" onclick="register()">Create Account</button>
      </div>
      <div id="msg" class="message"></div>
    </div>
  </div>

  <!-- GAME SECTION -->
  <div id="game-section" class="game-card hidden">
    <div class="game-header">
      <div class="user-badge">
        <span id="user-avatar">🦊</span>
        <span id="user-name">Player</span>
      </div>
      <button class="btn-logout" onclick="logout()">Log Out</button>
    </div>

    <!-- Level Selection -->
    <div>
      <div class="avatar-title">Select Level</div>
      <div class="level-grid">
        <button class="level-btn active" onclick="setLevel('A1', this)">A1</button>
        <button class="level-btn" onclick="setLevel('A2', this)">A2</button>
        <button class="level-btn" onclick="setLevel('B1', this)">B1</button>
        <button class="level-btn" onclick="setLevel('B2', this)">B2</button>
        <button class="level-btn" onclick="setLevel('C1', this)">C1</button>
        <button class="level-btn" onclick="setLevel('C2', this)">C2</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-box"><span class="stat-label">Lives</span><span id="lives-display">❤️❤️❤️</span></div>
      <div class="stat-box"><span class="stat-label">Time</span><span id="timer-display" style="color: #f59e0b;">60s</span></div>
      <div class="stat-box"><span class="stat-label">Score</span><span id="current-score" style="color: #38bdf8;">0</span></div>
    </div>

    <!-- Jokers Bar -->
    <div class="jokers-container">
      <button id="joker-5050" class="joker-btn" onclick="useFiftyFifty()">🎭 50/50 Joker</button>
      <button id="joker-time" class="joker-btn" onclick="useExtraTime()">⏳ +10s Time</button>
    </div>

    <!-- Bildirim Bandları -->
    <div id="review-banner" class="review-banner hidden">
      💡 REDEMPTION ROUND: Answer words you got wrong for +5 Pts each!
    </div>

    <div id="combo-banner" class="combo-banner hidden">
      🔥 3 COMBO! (1.5x Puan)
    </div>

    <div id="game-play-area">
      <div class="word-box">
        <p style="color: #64748b; font-size: 12px; margin-bottom: 5px;">Choose the correct synonym or translation:</p>
        <div id="target-word" class="target-word">Start</div>
      </div>

      <div class="options-grid" id="options-container" style="margin-top: 15px;"></div>
    </div>

    <div id="game-over-area" class="hidden">
      <h2 style="color: #f87171; margin-bottom: 10px;">Game Over! 🎮</h2>

      <button class="btn-restart" onclick="restartGame()">Play Again</button>
    </div>

    <div id="game-msg" class="message"></div>
  </div>

    function updateLeaderboard() {
      const users = JSON.parse(localStorage.getItem('users')) || [];
      const board = document.getElementById('leaderboard-list');
      
      users.sort((a, b) => (b.score || 0) - (a.score || 0));

      if(users.length === 0) {
        board.innerHTML = `<div style="color:#64748b; font-size:13px; text-align:center;">No scores yet!</div>`;
        return;
      }

      board.innerHTML = users.slice(0, 5).map((u, i) => `
        <div class="score-item">
          <div class="player-info">
            <span>#${i + 1}</span>
            <span>${u.avatar || '🦊'} ${u.username}</span>
          </div>
          <div>
            <span class="badge">${u.lastLevel || 'A1'}</span>
            <span class="points">${u.score || 0} Pts</span>
          </div>
        </div>
      `).join('');
    }

    function selectAvatar(el, avatar) {
      document.querySelectorAll('.avatar-item').forEach(i => i.classList.remove('selected'));
      el.classList.add('selected');
      selectedAvatar = avatar;
    }

    function switchTab(target) {
      if(target === 'login') {
        document.getElementById('login-form').classList.remove('hidden');
        document.getElementById('register-form').classList.add('hidden');
        document.getElementById('btn-login-tab').classList.add('active');
        document.getElementById('btn-reg-tab').classList.remove('active');
      } else {
        document.getElementById('register-form').classList.remove('hidden');
        document.getElementById('login-form').classList.add('hidden');
        document.getElementById('btn-reg-tab').classList.add('active');
        document.getElementById('btn-login-tab').classList.remove('active');
      }
    }

    function register() {
      const u = document.getElementById('reg-username').value.trim();
      const p = document.getElementById('reg-password').value.trim();
      if(!u || !p) return showMessage("Please fill in all fields!", "error");

      const users = JSON.parse(localStorage.getItem('users')) || [];
      if(users.some(x => x.username === u)) return showMessage("Username already taken!", "error");

      users.push({ username: u, password: p, avatar: selectedAvatar, score: 0, lastLevel: 'A1' });
      localStorage.setItem('users', JSON.stringify(users));
      updateLeaderboard();
      showMessage("Account created! Please log in.", "success");
      setTimeout(() => switchTab('login'), 1000);
    }

    function login() {
      const u = document.getElementById('login-username').value.trim();
      const p = document.getElementById('login-password').value.trim();
      const users = JSON.parse(localStorage.getItem('users')) || [];
      const user = users.find(x => x.username === u && x.password === p);

      if(user) {
        localStorage.setItem('activeUser', JSON.stringify(user));
        loginUser(user);
      } else {
        showMessage("Invalid username or password!", "error");
      }
    }

    function loginUser(user) {
      document.getElementById('auth-section').classList.add('hidden');
      document.getElementById('game-section').classList.remove('hidden');
      document.getElementById('user-avatar').innerText = user.avatar || '🦊';
      document.getElementById('user-name').innerText = user.username;
      restartGame();
    }

    function setLevel(lvl, el) {
      document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      currentLevel = lvl;
      restartGame();
    }

    function restartGame() {
      clearInterval(timerInterval);
      currentScore = 0;
      lives = 3;
      timeLeft = 60;
      canAnswer = true;
      playedWords = [];
      wrongWordsHistory = [];
      isReviewMode = false;
      comboCount = 0;
      
      // Jokerleri Sıfırla
      fiftyFiftyUsed = false;
      extraTimeUsed = false;
      document.getElementById('joker-5050').disabled = false;
      document.getElementById('joker-time').disabled = false;
      
      document.getElementById('review-banner').classList.add('hidden');
      document.getElementById('combo-banner').classList.add('hidden');
      document.getElementById('game-play-area').classList.remove('hidden');
      document.getElementById('game-over-area').classList.add('hidden');
      document.getElementById('current-score').innerText = currentScore;
      document.getElementById('lives-display').innerText = "❤️".repeat(lives);
      document.getElementById('timer-display').innerText = timeLeft + "s";
      document.getElementById('game-msg').className = "message";
      
      startTimer();
      nextQuestion();
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timer-display').innerText = timeLeft + "s";
        if(timeLeft <= 0) {
          clearInterval(timerInterval);
          startReviewMode();
        }
      }, 1000);
    }

    function nextQuestion() {
      canAnswer = true;
      document.getElementById('game-msg').className = "message";

      if(isReviewMode) {
        if(wrongWordsHistory.length === 0) {
          finishGame();
          return;
        }
        currentQuestion = wrongWordsHistory.shift();
      } else {
        const pool = wordDatabase[currentLevel] || wordDatabase['A1'];
        let availableWords = pool.filter(item => !playedWords.includes(item.word));

        if (availableWords.length === 0) {
          playedWords = [];
          availableWords = [...pool];
        }

        const index = Math.floor(Math.random() * availableWords.length);
        currentQuestion = availableWords[index];
        playedWords.push(currentQuestion.word);
      }

      document.getElementById('target-word').innerText = currentQuestion.word;
      let options = [...currentQuestion.wrong, currentQuestion.correct].sort(() => Math.random() - 0.5);

      const container = document.getElementById('options-container');
      container.innerHTML = "";
      options.forEach(o => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = o;
        btn.onclick = (e) => checkAnswer(o, e.target);
        container.appendChild(btn);
      });
    }

    function checkAnswer(selected, targetBtn) {
      if(!canAnswer) return;
      canAnswer = false;

      const msg = document.getElementById('game-msg');
      const allButtons = document.querySelectorAll('.option-btn');

      if(selected === currentQuestion.correct) {
        comboCount++;

        let multiplier = 1;
        if (comboCount >= 5) {
          multiplier = 2;
        } else if (comboCount >= 3) {
          multiplier = 1.5;
        }

        const basePoints = isReviewMode ? 5 : 10;
        const pointsAwarded = Math.round(basePoints * multiplier);

        currentScore += pointsAwarded;
        document.getElementById('current-score').innerText = currentScore;
        targetBtn.classList.add('correct-highlight');

        const comboBanner = document.getElementById('combo-banner');
        if (comboCount >= 3) {
          comboBanner.innerText = `🔥 ${comboCount} COMBO! (${multiplier}x Puan)`;
          comboBanner.classList.remove('hidden');
        } else {
          comboBanner.classList.add('hidden');
        }
        
        msg.innerText = `Correct! 🎉 (+${pointsAwarded} Pts)`;
        msg.className = "message success";
        setTimeout(nextQuestion, 800);
      } else {
        comboCount = 0;
        document.getElementById('combo-banner').classList.add('hidden');

        targetBtn.classList.add('wrong-highlight');
        allButtons.forEach(btn => {
          if(btn.innerText === currentQuestion.correct) {
            btn.classList.add('correct-highlight');
          }
        });

        if(!isReviewMode) {
          lives--;
          document.getElementById('lives-display').innerText = "❤️".repeat(Math.max(0, lives));
          
          if(!wrongWordsHistory.some(w => w.word === currentQuestion.word)) {
            wrongWordsHistory.push(currentQuestion);
          }

          msg.innerText = `Wrong! Correct answer was "${currentQuestion.correct}" ❌`;
          msg.className = "message error";
          
          if(lives <= 0) {
            clearInterval(timerInterval);
            setTimeout(startReviewMode, 1200);
          } else {
            setTimeout(nextQuestion, 1200);
          }
        } else {
          msg.innerText = `Wrong again! Correct was "${currentQuestion.correct}"`;
          msg.className = "message error";
          setTimeout(nextQuestion, 1200);
        }
      }
    }

    /* JOKER FONKSİYONLARI */
    function useFiftyFifty() {
      if(fiftyFiftyUsed || !canAnswer) return;
      fiftyFiftyUsed = true;
      document.getElementById('joker-5050').disabled = true;

      const buttons = Array.from(document.querySelectorAll('.option-btn'));
      // Yanlış cevaplı butonları bul
      const wrongButtons = buttons.filter(btn => btn.innerText !== currentQuestion.correct);

      // Rastgele 2 tanesini seçip devre dışı bırak
      wrongButtons.sort(() => Math.random() - 0.5);
      wrongButtons.slice(0, 2).forEach(btn => {
        btn.disabled = true;
        btn.innerText = "❌";
      });
    }

    function useExtraTime() {
      if(extraTimeUsed || isReviewMode) return;
      extraTimeUsed = true;
      document.getElementById('joker-time').disabled = true;

      timeLeft += 10;
      document.getElementById('timer-display').innerText = timeLeft + "s";
    }

    function startReviewMode() {
      if(wrongWordsHistory.length === 0) {
        finishGame();
        return;
      }
      
      isReviewMode = true;
      document.getElementById('joker-5050').disabled = true;
      document.getElementById('joker-time').disabled = true;
      document.getElementById('combo-banner').classList.add('hidden');
      document.getElementById('review-banner').classList.remove('hidden');
      document.getElementById('timer-display').innerText = "OFF";
      nextQuestion();
    }

    function finishGame() {
      clearInterval(timerInterval);
      document.getElementById('review-banner').classList.add('hidden');
      document.getElementById('combo-banner').classList.add('hidden');
      document.getElementById('game-play-area').classList.add('hidden');
      document.getElementById('game-over-area').classList.remove('hidden');
      document.getElementById('final-score').innerText = currentScore;
      document.getElementById('game-msg').className = "message";

      saveUserScore();
    }

    function saveUserScore() {
      const activeUser = JSON.parse(localStorage.getItem('activeUser'));
      if(!activeUser) return;

      const users = JSON.parse(localStorage.getItem('users')) || [];
      const userIndex = users.findIndex(u => u.username === activeUser.username);

      if(userIndex !== -1) {
        if(currentScore > (users[userIndex].score || 0)) {
          users[userIndex].score = currentScore;
          users[userIndex].lastLevel = currentLevel;
          activeUser.score = currentScore;
          activeUser.lastLevel = currentLevel;
          
          localStorage.setItem('users', JSON.stringify(users));
          localStorage.setItem('activeUser', JSON.stringify(activeUser));
        }
      }
      updateLeaderboard();
    }

    function logout() {
      clearInterval(timerInterval);
      localStorage.removeItem('activeUser');
      document.getElementById('game-section').classList.add('hidden');
      document.getElementById('auth-section').classList.remove('hidden');
      updateLeaderboard();
    }

    function showMessage(m, type) {
      const el = document.getElementById('msg');
      el.innerText = m;
      el.className = "message " + type;
    }
  </script>
</body>
